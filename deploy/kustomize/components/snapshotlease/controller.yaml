apiVersion: v1
kind: ServiceAccount
metadata:
  name: sg-cosi-snapshotlease-controller
  labels:
    app.kubernetes.io/name: sg-cosi-snapshotlease-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sg-cosi-snapshotlease-controller
  labels:
    app.kubernetes.io/name: sg-cosi-snapshotlease-controller
rules:
  - apiGroups: ["cosi.scaleoutsean.github.io"]
    resources: ["snapshotleases"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["cosi.scaleoutsean.github.io"]
    resources: ["snapshotleases/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["bucketclasses", "bucketaccessclasses", "bucketclaims", "bucketaccesses"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sg-cosi-snapshotlease-controller
  labels:
    app.kubernetes.io/name: sg-cosi-snapshotlease-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sg-cosi-snapshotlease-controller
subjects:
  - kind: ServiceAccount
    name: sg-cosi-snapshotlease-controller
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sg-cosi-snapshotlease-controller
  labels:
    app.kubernetes.io/name: sg-cosi-snapshotlease-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sg-cosi-snapshotlease-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sg-cosi-snapshotlease-controller
    spec:
      serviceAccountName: sg-cosi-snapshotlease-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: docker.io/scaleoutsean/sg-cosi-driver:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/sg-cosi-snapshotlease-controller"]
          args:
            - "--driver-name=sg.cosi.dev"
            - "--max-lifetime=168h"
            - "--credential-grace=1h"
            - "--resync-interval=1h"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi